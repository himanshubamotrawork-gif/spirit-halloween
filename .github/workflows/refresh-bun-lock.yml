name: Refresh Bun lockfile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Regenerate lockfile
        run: bun install

      - name: Verify patched TanStack Start packages
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lock = readFileSync('bun.lock', 'utf8');
          const reactStart = lock.match(/"@tanstack\/react-start": \["@tanstack\/react-start@([^"]+)/);
          const serverCore = lock.match(/"@tanstack\/start-server-core": \["@tanstack\/start-server-core@([^"]+)/);
          console.log('react-start:', reactStart?.[1] ?? 'not found');
          console.log('start-server-core:', serverCore?.[1] ?? 'not found');
          if (!reactStart || !serverCore) throw new Error('Could not identify resolved TanStack packages in bun.lock');
          const version = (s) => s.split('.').map(Number);
          const atLeast = (actual, required) => {
            const a = version(actual), b = version(required);
            for (let i = 0; i < 3; i++) if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) > (b[i] || 0);
            return true;
          };
          if (!atLeast(reactStart[1], '1.168.60')) throw new Error('react-start is still below 1.168.60');
          if (!atLeast(serverCore[1], '1.169.39')) throw new Error('start-server-core is still below 1.169.39');
          NODE

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: regenerate Bun lockfile for TanStack security fix"
          git push
